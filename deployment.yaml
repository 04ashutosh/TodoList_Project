apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
      - name: react-app
        image: ashutoshdash2004/react-app:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "250m"  # Minimum CPU request
          limits:
            cpu: "500m"  # Max CPU limit
